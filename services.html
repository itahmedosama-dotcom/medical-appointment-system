<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D4A43">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>الخدمات — برنامج حجز عيادات</title>
<script>
  (function(){
    var lang = localStorage.getItem('mas_lang') || 'ar';
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
    document.write('<link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/' + (lang === 'en' ? 'bootstrap.min.css' : 'bootstrap.rtl.min.css') + '" rel="stylesheet">');
  })();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar-backdrop"></div>
<div class="app-shell">

  <aside class="app-sidebar">
    <div class="sidebar-brand"><div class="mark">ح</div><div class="name"><span data-i18n="appName">برنامج حجز عيادات</span><small data-i18n="sidebarSubtitle">نظام إدارة المواعيد</small></div></div>
    <nav class="sidebar-nav">
      <a href="index.html"><i class="fa-solid fa-house"></i> <span data-i18n="navHome">الرئيسية</span></a>
      <a href="daily-appointments.html" data-perm="appointments"><i class="fa-solid fa-calendar-days"></i> <span data-i18n="navAppointments">المواعيد</span></a>
      <a href="patients.html" data-perm="patients"><i class="fa-solid fa-user-injured"></i> <span data-i18n="navPatients">المرضى</span></a>
      <a href="providers.html" data-perm="providers"><i class="fa-solid fa-user-doctor"></i> <span data-i18n="navProviders">مقدمو الخدمة</span></a>
      <a href="services.html" data-perm="services" class="active"><i class="fa-solid fa-stethoscope"></i> <span data-i18n="navServices">الخدمات</span></a>
      <a href="reports.html" data-perm="reports"><i class="fa-solid fa-chart-simple"></i> <span data-i18n="navReports">التقارير</span></a>
      <a href="settings.html" data-perm="settings"><i class="fa-solid fa-gear"></i> <span data-i18n="navSettings">الإعدادات</span></a>
      <a href="permissions.html" data-perm="permissions"><i class="fa-solid fa-user-shield"></i> <span data-i18n="navPermissions">الصلاحيات</span></a>
    </nav>
    <div class="sidebar-foot"><a href="#" onclick="logout();return false;" style="color:#CBE2DD;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span data-i18n="logout">تسجيل الخروج</span></a></div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <button class="topbar-btn d-lg-none" data-toggle="sidebar"><i class="fa-solid fa-bars"></i></button>
      <div class="search-box"><input type="text" data-i18n-placeholder="search" placeholder="بحث..."><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div id="langSwitcherHost"></div>
        <button class="topbar-btn"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
        <div class="avatar-chip"><div class="initials">؟؟</div><div class="who"><div class="n">...</div><div class="r">...</div></div></div>
      </div>
    </header>

    <main class="app-content">
      <div id="apiWarning" class="alert d-none mb-3" style="background:var(--warning-tint);color:var(--warning);border:none;border-radius:var(--radius);font-size:.85rem;">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> <span data-i18n="apiNotConfigured">الواجهة غير متصلة بقاعدة البيانات بعد.</span>
      </div>

      <div class="page-head">
        <div>
          <div class="eyebrow" data-i18n="servicesEyebrow">قائمة الخدمات</div>
          <h1 data-i18n="servicesTitle">الخدمات</h1>
          <p data-i18n="servicesSubtitle">حدّد احتياج كل خدمة.</p>
        </div>
        <button class="btn btn-teal" onclick="openServiceModal()"><i class="fa-solid fa-plus me-1"></i> <span data-i18n="addService">إضافة خدمة</span></button>
      </div>

      <div class="row g-3" id="servicesGrid">
        <div class="col-12 text-center faint py-4" data-i18n="loading">جارِ التحميل...</div>
      </div>
    </main>
  </div>
</div>

<!-- Service Modal -->
<div class="modal fade" id="serviceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <div class="modal-header"><h5 class="modal-title" id="serviceModalTitle" data-i18n="addServiceTitle">إضافة خدمة</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="serviceForm">
          <input type="hidden" id="serviceId">
          <div class="mb-3"><label class="form-label" data-i18n="serviceName">اسم الخدمة</label><input type="text" id="serviceName" class="form-control" data-i18n-placeholder="serviceNamePlaceholder" placeholder="مثال: جلسة ليزر" required></div>
          <div class="mb-3"><label class="form-label" data-i18n="serviceDuration">مدة الخدمة (دقيقة)</label><input type="number" id="serviceDuration" class="form-control" value="20"></div>
          <label class="form-label" data-i18n="needsLabel">الاحتياجات</label>
          <div class="d-flex flex-column gap-2">
            <label class="need-check" id="needDoctorWrap" style="cursor:pointer;">
              <span><i class="fa-solid fa-user-doctor me-2" style="color:var(--teal)"></i> <span data-i18n="needDoctor">تحتاج طبيب</span></span>
              <input type="checkbox" id="needDoctor">
            </label>
            <label class="need-check" id="needNurseWrap" style="cursor:pointer;">
              <span><i class="fa-solid fa-user-nurse me-2" style="color:var(--violet)"></i> <span data-i18n="needNurse">تحتاج ممرضة</span></span>
              <input type="checkbox" id="needNurse">
            </label>
            <label class="need-check" id="needDeviceWrap" style="cursor:pointer;">
              <span><i class="fa-solid fa-radiation me-2" style="color:var(--amber)"></i> <span data-i18n="needDevice">تحتاج جهاز</span></span>
              <input type="checkbox" id="needDevice">
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" data-bs-dismiss="modal" data-i18n="cancel">إلغاء</button>
        <button class="btn btn-teal" id="saveServiceBtn" onclick="saveService()" data-i18n="save">حفظ</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  const user = requireAuth();
  if(!Api.isConfigured()) document.getElementById('apiWarning').classList.remove('d-none');

  let servicesCache = [];
  const serviceModal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('serviceModal'));

  function bool(v){ return v === true || String(v).toLowerCase() === 'true'; }

  function renderServices(list){
    const grid = document.getElementById('servicesGrid');
    if(list.length === 0){
      grid.innerHTML = `<div class="col-12 text-center faint py-4">${t('noServicesFound')}</div>`;
      return;
    }
    grid.innerHTML = list.map(s => `
      <div class="col-md-6 col-xl-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h3 style="font-size:1.05rem;margin:0;">${s.Name}</h3>
              <span class="text-mono faint">${s.Duration || 0} ${t('minutesSuffix')}</span>
            </div>
            <div class="d-flex flex-wrap gap-2 mb-3">
              ${bool(s.NeedsDoctor) ? `<span class="lane-chip doctor"><span class="lane-dot doctor"></span> ${t('doctor')}</span>` : ''}
              ${bool(s.NeedsNurse)  ? `<span class="lane-chip nurse"><span class="lane-dot nurse"></span> ${t('nurse')}</span>` : ''}
              ${bool(s.NeedsDevice) ? `<span class="lane-chip device"><span class="lane-dot device"></span> ${t('device')}</span>` : ''}
              ${(!bool(s.NeedsDoctor) && !bool(s.NeedsNurse) && !bool(s.NeedsDevice)) ? `<span class="faint" style="font-size:.8rem;">${t('noNeedsSet')}</span>` : ''}
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-soft btn-sm flex-fill" onclick='openServiceModal(${JSON.stringify(s)})'><i class="fa-regular fa-pen-to-square me-1"></i> ${t('edit')}</button>
              <button class="btn btn-icon btn-soft" onclick="deleteService('${s.ID}', '${(s.Name||'').replace(/'/g,'')}')"><i class="fa-regular fa-trash-can text-danger"></i></button>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  async function loadServices(){
    if(!Api.isConfigured()) return;
    try{
      servicesCache = await Api.getServices();
      renderServices(servicesCache);
    } catch(err){
      Swal.fire({ icon:'error', title: t('errorTitle'), text: err.message, confirmButtonColor:'#14685E' });
    }
  }

  function syncNeedCheck(id){
    const cb = document.getElementById(id);
    const wrap = cb.closest('.need-check');
    wrap.classList.toggle('active', cb.checked);
  }
  ['needDoctor','needNurse','needDevice'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => syncNeedCheck(id));
  });

  function openServiceModal(s){
    document.getElementById('serviceForm').reset();
    document.querySelectorAll('.need-check').forEach(el => el.classList.remove('active'));
    if(s){
      document.getElementById('serviceModalTitle').textContent = t('editServiceTitle');
      document.getElementById('serviceId').value = s.ID;
      document.getElementById('serviceName').value = s.Name || '';
      document.getElementById('serviceDuration').value = s.Duration || 20;
      document.getElementById('needDoctor').checked = bool(s.NeedsDoctor);
      document.getElementById('needNurse').checked = bool(s.NeedsNurse);
      document.getElementById('needDevice').checked = bool(s.NeedsDevice);
    } else {
      document.getElementById('serviceModalTitle').textContent = t('addServiceTitle');
      document.getElementById('serviceId').value = '';
    }
    ['needDoctor','needNurse','needDevice'].forEach(syncNeedCheck);
    serviceModal().show();
  }

  async function saveService(){
    const id = document.getElementById('serviceId').value;
    const data = {
      name: document.getElementById('serviceName').value.trim(),
      duration: document.getElementById('serviceDuration').value,
      needsDoctor: document.getElementById('needDoctor').checked,
      needsNurse: document.getElementById('needNurse').checked,
      needsDevice: document.getElementById('needDevice').checked
    };
    if(!data.name){
      Swal.fire({ icon:'warning', title: t('serviceNameRequired'), confirmButtonColor:'#14685E' });
      return;
    }
    const btn = document.getElementById('saveServiceBtn');
    btn.disabled = true;
    try{
      if(id) await Api.updateService(id, data);
      else await Api.createService(data);
      serviceModal().hide();
      await loadServices();
      Swal.fire({ toast:true, position:'top-start', icon:'success', title: t('savedToast'), showConfirmButton:false, timer:1600 });
    } catch(err){
      Swal.fire({ icon:'error', title: t('errorTitle'), text: err.message, confirmButtonColor:'#14685E' });
    } finally {
      btn.disabled = false;
    }
  }

  function deleteService(id, name){
    Swal.fire({
      title: t('confirmDeleteTitle'), text: `${name}? ${t('confirmDeleteText')}`, icon:'warning',
      showCancelButton:true, confirmButtonText: t('delete'), cancelButtonText: t('cancel'),
      confirmButtonColor:'#BE4B3B', cancelButtonColor:'#8B9C98', reverseButtons:true
    }).then(res => {
      if(!res.isConfirmed) return;
      Api.deleteService(id).then(() => {
        loadServices();
        Swal.fire({ toast:true, position:'top-start', icon:'success', title: t('deletedToast'), showConfirmButton:false, timer:1600 });
      }).catch(err => {
        Swal.fire({ icon:'error', title: t('errorTitle'), text: err.message, confirmButtonColor:'#14685E' });
      });
    });
  }

  loadServices();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D4A43">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>تسجيل الدخول — برنامج حجز عيادات</title>
<script>
  (function(){
    var lang = localStorage.getItem('mas_lang') || 'ar';
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
    document.write('<link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/' + (lang === 'en' ? 'bootstrap.min.css' : 'bootstrap.rtl.min.css') + '" rel="stylesheet">');
  })();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-visual d-none d-lg-flex">
    <div>
      <div class="d-flex align-items-center gap-2 mb-5">
        <div class="mark" style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;">ح</div>
        <div>
          <div style="font-family:'Cairo';font-weight:800;font-size:1.1rem;" data-i18n="appName">برنامج حجز عيادات</div>
          <small style="color:#A9C6C0;" data-i18n="sidebarSubtitle">نظام إدارة المواعيد</small>
        </div>
      </div>
      <h1 style="color:#fff;font-size:2.1rem;max-width:420px;" data-i18n="heroTitle">جدول يومك الطبي، منظم حسب كل طبيب وممرضة وجهاز.</h1>
      <p style="color:#B9D6D0;max-width:400px;font-size:.95rem;" data-i18n="heroSubtitle">لا مزيد من التعارض بين المواعيد.</p>
    </div>

    <div>
      <div class="lane-strip">
        <span style="background:var(--teal);"></span>
        <span style="background:var(--violet);"></span>
        <span style="background:var(--amber);"></span>
      </div>
      <div class="d-flex gap-4 mt-2" style="font-size:.72rem;color:#9FC4BD;">
        <span><i class="fa-solid fa-circle" style="color:var(--teal);font-size:.5rem;"></i> <span data-i18n="doctorsLabel">أطباء</span></span>
        <span><i class="fa-solid fa-circle" style="color:var(--violet);font-size:.5rem;"></i> <span data-i18n="nursesLabel">ممرضات</span></span>
        <span><i class="fa-solid fa-circle" style="color:var(--amber);font-size:.5rem;"></i> <span data-i18n="devicesLabel">أجهزة</span></span>
      </div>
    </div>
  </div>

  <div class="login-form-col">
    <div class="login-card">
      <div class="d-flex justify-content-between align-items-start mb-4">
        <div class="text-center d-lg-none">
          <div class="mark mx-auto" style="width:46px;height:46px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;color:#fff;">ح</div>
        </div>
        <div class="ms-auto">
          <button type="button" class="btn btn-soft btn-sm" id="langSwitchBtnLogin" style="font-weight:800;"></button>
        </div>
      </div>
      <div class="eyebrow" style="font-size:.74rem;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.08em;" data-i18n="loginEyebrow">تسجيل الدخول</div>
      <h1 class="mb-1" style="font-size:1.5rem;" data-i18n="loginTitle">أهلًا بعودتك</h1>
      <p class="muted mb-4" style="font-size:.88rem;" data-i18n="loginSubtitle">سجّل الدخول لمتابعة حجوزات اليوم.</p>

      <div id="loginError" class="alert alert-danger d-none" style="border-radius:var(--radius);font-size:.85rem;"></div>
      <div id="configWarning" class="alert d-none" style="background:var(--warning-tint);color:var(--warning);border:none;border-radius:var(--radius);font-size:.8rem;">
        <i class="fa-solid fa-triangle-exclamation me-1"></i>
        <span data-i18n="apiNotConfigured">لم يتم ضبط رابط الـ API بعد.</span>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" data-i18n="username">اسم المستخدم</label>
          <div class="position-relative">
            <input type="text" id="username" class="form-control ps-5" placeholder="admin" autocomplete="username" required>
            <i class="fa-regular fa-user input-icon-end"></i>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="password">كلمة المرور</label>
          <div class="position-relative">
            <input type="password" id="password" class="form-control ps-5" placeholder="••••••••" autocomplete="current-password" required>
            <i class="fa-regular fa-lock-keyhole input-icon-end"></i>
          </div>
        </div>
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" checked>
            <label class="form-check-label" for="remember" style="font-size:.84rem;" data-i18n="rememberMe">تذكرني</label>
          </div>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-teal w-100 py-2" data-i18n="loginBtn">تسجيل الدخول</button>
      </form>

      <p class="text-center faint mt-4" style="font-size:.78rem;" data-i18n="demoCreds">بيانات تجريبية: admin / admin123</p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script>
  if(!Api.isConfigured()) document.getElementById('configWarning').classList.remove('d-none');
  if(localStorage.getItem('mas_user')) window.location.href = 'index.html';

  // زر تبديل اللغة في صفحة الدخول (قبل ما يكون فيه مستخدم مسجل، فقط محليًا)
  document.getElementById('langSwitchBtnLogin').textContent = t('langSwitchLabel');
  document.getElementById('langSwitchBtnLogin').addEventListener('click', () => {
    localStorage.setItem('mas_lang', getLang() === 'ar' ? 'en' : 'ar');
    window.location.reload();
  });

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('loginError');
    errBox.classList.add('d-none');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = t('loggingIn');

    Api.login(username, password)
      .then(user => {
        localStorage.setItem('mas_user', JSON.stringify(user));
        // طبّق لغة الحساب المحفوظة فورًا (لو مختلفة عن اللغة المحلية الحالية)
        if(user.language) localStorage.setItem('mas_lang', user.language);
        window.location.href = 'index.html';
      })
      .catch(err => {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = originalText;
      });
  });
</script>
</body>
</html>

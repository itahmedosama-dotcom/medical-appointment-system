<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D4A43">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>المرضى — مركز الشفاء الطبي</title>
<script>
  (function(){
    var lang = localStorage.getItem('mas_lang') || 'ar';
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
    document.write('<link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/' + (lang === 'en' ? 'bootstrap.min.css' : 'bootstrap.rtl.min.css') + '" rel="stylesheet">');
  })();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar-backdrop"></div>
<div class="app-shell">

  <aside class="app-sidebar">
    <div class="sidebar-brand"><div class="mark">ش</div><div class="name"><span data-i18n="appName">مركز الشفاء الطبي</span><small data-i18n="sidebarSubtitle">نظام إدارة المواعيد</small></div></div>
    <nav class="sidebar-nav">
      <a href="index.html"><i class="fa-solid fa-house"></i> <span data-i18n="navHome">الرئيسية</span></a>
      <a href="patients.html" class="active"><i class="fa-solid fa-user-injured"></i> <span data-i18n="navPatients">المرضى</span></a>
      <a href="providers.html"><i class="fa-solid fa-user-doctor"></i> <span data-i18n="navProviders">مقدمو الخدمة</span></a>
      <a href="services.html"><i class="fa-solid fa-stethoscope"></i> <span data-i18n="navServices">الخدمات</span></a>
      <div class="nav-section-label" data-i18n="navAppointmentsSection">المواعيد</div>
      <a href="booking.html"><i class="fa-solid fa-calendar-plus"></i> <span data-i18n="navBooking">الحجز</span></a>
      <a href="daily-appointments.html"><i class="fa-solid fa-calendar-days"></i> <span data-i18n="navDaily">الحجوزات اليومية</span></a>
      <div class="nav-section-label" data-i18n="navSystemSection">النظام</div>
      <a href="reports.html"><i class="fa-solid fa-chart-simple"></i> <span data-i18n="navReports">التقارير</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span data-i18n="navSettings">الإعدادات</span></a>
    </nav>
    <div class="sidebar-foot"><a href="#" onclick="logout();return false;" style="color:#CBE2DD;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span data-i18n="logout">تسجيل الخروج</span></a></div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <button class="topbar-btn d-lg-none" data-toggle="sidebar"><i class="fa-solid fa-bars"></i></button>
      <div class="search-box"><input type="text" id="searchBox" data-i18n-placeholder="search" placeholder="بحث..."><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div id="langSwitcherHost"></div>
        <button class="topbar-btn"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
        <div class="avatar-chip"><div class="initials">؟؟</div><div class="who"><div class="n">...</div><div class="r">...</div></div></div>
      </div>
    </header>

    <main class="app-content">
      <div id="apiWarning" class="alert d-none mb-3" style="background:var(--warning-tint);color:var(--warning);border:none;border-radius:var(--radius);font-size:.85rem;">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> <span data-i18n="apiNotConfigured">الواجهة غير متصلة بقاعدة البيانات بعد.</span>
      </div>

      <div class="page-head">
        <div>
          <div class="eyebrow" data-i18n="patientsEyebrow">إدارة المرضى</div>
          <h1 data-i18n="patientsTitle">المرضى</h1>
          <p><span id="patientsCount">0</span> <span data-i18n="patientsCountSuffix">مريض مسجل</span></p>
        </div>
        <button class="btn btn-teal" onclick="openPatientModal()"><i class="fa-solid fa-plus me-1"></i> <span data-i18n="addPatient">إضافة مريض</span></button>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-clean mb-0">
            <thead><tr>
              <th data-i18n="colPatient">المريض</th><th data-i18n="colPhone">الهاتف</th><th data-i18n="colAge">العمر</th>
              <th data-i18n="colGender">الجنس</th><th data-i18n="colNotes">ملاحظات</th><th></th>
            </tr></thead>
            <tbody id="patientsBody">
              <tr><td colspan="6" class="text-center faint py-4" data-i18n="loading">جارِ التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Patient Modal -->
<div class="modal fade" id="patientModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:16px;border:none;">
      <div class="modal-header"><h5 class="modal-title" id="patientModalTitle" data-i18n="addPatientTitle">إضافة مريض</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="patientForm">
          <input type="hidden" id="patientId">
          <div class="mb-3"><label class="form-label" data-i18n="name">الاسم</label><input type="text" id="patientName" class="form-control" required></div>
          <div class="row g-3">
            <div class="col-6"><label class="form-label" data-i18n="colPhone">الهاتف</label><input type="tel" id="patientPhone" class="form-control text-mono" placeholder="201xxxxxxxxx" required></div>
            <div class="col-6"><label class="form-label" data-i18n="age">العمر</label><input type="number" id="patientAge" class="form-control"></div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label" data-i18n="gender">الجنس</label>
            <div class="d-flex gap-3">
              <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="genderMale" value="ذكر" checked><label class="form-check-label" for="genderMale" data-i18n="male">ذكر</label></div>
              <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="genderFemale" value="أنثى"><label class="form-check-label" for="genderFemale" data-i18n="female">أنثى</label></div>
            </div>
          </div>
          <div><label class="form-label" data-i18n="notes">ملاحظات</label><textarea id="patientNotes" class="form-control" rows="3" data-i18n-placeholder="notesPlaceholder" placeholder="حساسية، ملاحظات طبية..."></textarea></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-soft" data-bs-dismiss="modal" data-i18n="cancel">إلغاء</button>
        <button class="btn btn-teal" id="savePatientBtn" onclick="savePatient()" data-i18n="save">حفظ</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  const user = requireAuth();
  if(!Api.isConfigured()) document.getElementById('apiWarning').classList.remove('d-none');

  let patientsCache = [];
  const patientModal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('patientModal'));

  function renderPatients(list){
    const tbody = document.getElementById('patientsBody');
    document.getElementById('patientsCount').textContent = patientsCache.length;
    if(list.length === 0){
      tbody.innerHTML = `<tr><td colspan="6" class="text-center faint py-4">${t('noPatientsFound')}</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(p => `
      <tr>
        <td class="name-cell"><div class="avatar">${(p.Name||'?')[0]}</div> ${p.Name}</td>
        <td class="text-mono">${p.Phone||''}</td>
        <td>${p.Age||'-'}</td>
        <td>${p.Gender === 'أنثى' || p.Gender === 'Female' ? t('female') : t('male')}</td>
        <td class="faint">${p.Notes || '—'}</td>
        <td class="text-end">
          <button class="btn btn-icon btn-soft" onclick='openPatientModal(${JSON.stringify(p)})'><i class="fa-regular fa-pen-to-square"></i></button>
          <button class="btn btn-icon btn-soft" onclick="deletePatient('${p.ID}', '${(p.Name||'').replace(/'/g,'')}')"><i class="fa-regular fa-trash-can text-danger"></i></button>
        </td>
      </tr>`).join('');
  }

  async function loadPatients(){
    if(!Api.isConfigured()) return;
    try{
      patientsCache = await Api.getPatients();
      renderPatients(patientsCache);
    } catch(err){
      Swal.fire({ icon:'error', title: t('errorTitle'), text: err.message, confirmButtonColor:'#14685E' });
    }
  }

  document.getElementById('searchBox').addEventListener('input', e => {
    const q = e.target.value.trim();
    const filtered = patientsCache.filter(p =>
      (p.Name||'').includes(q) || String(p.Phone||'').includes(q));
    renderPatients(filtered);
  });

  function openPatientModal(p){
    document.getElementById('patientForm').reset();
    if(p){
      document.getElementById('patientModalTitle').textContent = t('editPatientTitle');
      document.getElementById('patientId').value = p.ID;
      document.getElementById('patientName').value = p.Name || '';
      document.getElementById('patientPhone').value = p.Phone || '';
      document.getElementById('patientAge').value = p.Age || '';
      document.getElementById('patientNotes').value = p.Notes || '';
      if(p.Gender === 'أنثى' || p.Gender === 'Female') document.getElementById('genderFemale').checked = true;
      else document.getElementById('genderMale').checked = true;
    } else {
      document.getElementById('patientModalTitle').textContent = t('addPatientTitle');
      document.getElementById('patientId').value = '';
    }
    patientModal().show();
  }

  async function savePatient(){
    const id = document.getElementById('patientId').value;
    const data = {
      name: document.getElementById('patientName').value.trim(),
      phone: document.getElementById('patientPhone').value.trim(),
      age: document.getElementById('patientAge').value,
      gender: document.querySelector('input[name="gender"]:checked').value,
      notes: document.getElementById('patientNotes').value.trim()
    };
    if(!data.name || !data.phone){
      Swal.fire({ icon:'warning', title: t('nameRequired'), confirmButtonColor:'#14685E' });
      return;
    }
    const btn = document.getElementById('savePatientBtn');
    btn.disabled = true;
    try{
      if(id) await Api.updatePatient(id, data);
      else await Api.createPatient(data);
      patientModal().hide();
      await loadPatients();
      Swal.fire({ toast:true, position:'top-start', icon:'success', title: t('savedToast'), showConfirmButton:false, timer:1600 });
    } catch(err){
      Swal.fire({ icon:'error', title: t('errorTitle'), text: err.message, confirmButtonColor:'#14685E' });
    } finally {
      btn.disabled = false;
    }
  }

  function deletePatient(id, name){
    Swal.fire({
      title: t('confirmDeleteTitle'), text: `${name}? ${t('confirmDeleteText')}`, icon:'warning',
      showCancelButton:true, confirmButtonText: t('delete'), cancelButtonText: t('cancel'),
      confirmButtonColor:'#BE4B3B', cancelButtonColor:'#8B9C98', reverseButtons:true
    }).then(res => {
      if(!res.isConfirmed) return;
      Api.deletePatient(id).then(() => {
        loadPatients();
        Swal.fire({ toast:true, position:'top-start', icon:'success', title: t('deletedToast'), showConfirmButton:false, timer:1600 });
      }).catch(err => {
        Swal.fire({ icon:'error', title: t('errorTitle'), text: err.message, confirmButtonColor:'#14685E' });
      });
    });
  }

  loadPatients();
</script>
</body>
</html>
